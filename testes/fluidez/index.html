<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Teste de fluidez</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #05070D; color: #fff; font: 15px/1.4 system-ui, sans-serif; }
  #pista { height: 500vh; }
  #palco { position: fixed; inset: 0; }
  #palco video, #palco canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
  #placar { position: fixed; left: 12px; right: 12px; top: 12px; padding: 10px 12px; border-radius: 10px;
            background: rgba(0,0,0,.72); font-variant-numeric: tabular-nums; z-index: 2; }
  #placar b { color: #22D3EE; font-size: 22px; }
  #modos { position: fixed; left: 12px; right: 12px; bottom: 16px; display: flex; gap: 8px; z-index: 2; }
  #modos a { flex: 1; text-align: center; padding: 12px; border-radius: 999px; color: #fff; text-decoration: none;
             border: 1px solid #22D3EE; background: rgba(0,0,0,.6); }
  #modos a.ativo { background: #22D3EE; color: #05070D; font-weight: 700; }
</style>
</head>
<body>
<div id="palco"></div>
<div id="placar">carregando…</div>
<div id="pista"></div>
<nav id="modos"><a href="?modo=video">Vídeo (como hoje)</a><a href="?modo=imagens">Sequência de imagens</a></nav>
<script>
// Teste A/B da rolagem no celular: o mesmo trecho 1 como vídeo (busca no currentTime, igual à engine)
// e como sequência de 121 JPEG desenhada num canvas. O placar mostra quantas imagens novas por segundo
// aparecem enquanto o dedo rola e quanto tempo cada uma leva.
var modo = new URLSearchParams(location.search).get('modo') === 'imagens' ? 'imagens' : 'video';
document.querySelectorAll('#modos a')[modo === 'video' ? 0 : 1].classList.add('ativo');
var palco = document.getElementById('palco'), placar = document.getElementById('placar');
var N = 121, trocas = [], custos = [], pior = 0;

function progresso() {
  var max = document.documentElement.scrollHeight - innerHeight;
  return Math.min(1, Math.max(0, scrollY / max));
}
function marcar(ms) {
  var agora = performance.now();
  trocas.push(agora); custos.push(ms);
  if (trocas.length > 1) pior = Math.max(pior, agora - trocas[trocas.length - 2]);
}
var carregando = true;
setInterval(function () {
  if (carregando) return;
  var agora = performance.now();
  trocas = trocas.filter(function (t) { return agora - t < 1000; });
  custos = custos.slice(-30);
  var media = custos.length ? custos.reduce(function (a, b) { return a + b; }, 0) / custos.length : 0;
  placar.innerHTML = (modo === 'video' ? 'VÍDEO' : 'IMAGENS') + ' · role com o dedo<br>' +
    'imagens novas por segundo: <b>' + trocas.length + '</b><br>' +
    'tempo por imagem: ' + media.toFixed(0) + ' ms · maior espera: ' + pior.toFixed(0) + ' ms';
}, 250);
addEventListener('touchstart', function () { pior = 0; }, { passive: true });

if (modo === 'video') {
  fetch('../../assets/vid/cena1-m.mp4').then(function (r) { return r.blob(); }).then(function (b) {
    var v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
    v.src = URL.createObjectURL(b);
    palco.appendChild(v);
    carregando = false;
    addEventListener('touchstart', function () { v.play().then(function () { v.pause(); }).catch(function () {}); }, { once: true });
    var inicio = 0;
    v.addEventListener('seeked', function () { marcar(performance.now() - inicio); });
    (function laco() {
      if (!v.seeking && v.duration) {
        var t = Math.min(progresso(), 0.999) * v.duration;
        if (Math.abs(v.currentTime - t) > 0.02) { inicio = performance.now(); v.currentTime = t; }
      }
      requestAnimationFrame(laco);
    })();
  });
} else {
  var c = document.createElement('canvas'); c.width = 1080; c.height = 1920; palco.appendChild(c);
  var ctx = c.getContext('2d'), quadros = [], prontos = 0, atual = -1;
  for (var i = 1; i <= N; i++) {
    var img = new Image();
    img.decoding = 'async';
    img.onload = function () { prontos++; if (this.decode) this.decode().catch(function () {}); };
    img.src = 'q/' + String(i).padStart(3, '0') + '.jpg';
    quadros.push(img);
  }
  (function laco() {
    var k = Math.round(progresso() * (N - 1));
    if (k !== atual && quadros[k].complete && quadros[k].naturalWidth) {
      var t0 = performance.now();
      ctx.drawImage(quadros[k], 0, 0, 1080, 1920);
      atual = k; marcar(performance.now() - t0);
    }
    if (prontos < N) placar.textContent = 'carregando imagens ' + prontos + '/' + N; else carregando = false;
    requestAnimationFrame(laco);
  })();
}
</script>
</body>
</html>
